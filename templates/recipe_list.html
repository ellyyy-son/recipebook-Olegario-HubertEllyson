{% extends 'base.html' %}
{% load static %}

{% block title %} Recipe List {% endblock %}
{% block content %}
<h2>List of Recipes:</h2>
    <ol>
        {% for recipe in recipe_list%}
            <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
        {% endfor %}
    </ol>
{% endblock %}
